name: Deploy Frontend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  validate:
    name: Build & lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_GITHUB_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GITHUB_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Typecheck
        run: yarn typecheck

      - name: Dependency audit (production — blocking)
        run: yarn audit --groups dependencies --level high

      - name: Dependency audit (dev tooling — informational)
        run: yarn audit --groups devDependencies --level high
        continue-on-error: true

      - name: Build
        run: yarn build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests with coverage
        run: yarn test --coverage --coverageReporters=text-summary --coverageReporters=json-summary

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "## Test coverage"
            echo
            if [ -f coverage/coverage-summary.json ]; then
              python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("coverage/coverage-summary.json").read_text())
          total = data.get("total", {})
          print("| Metric | Covered | Total | Pct |")
          print("| --- | ---: | ---: | ---: |")
          for key in ("statements", "branches", "functions", "lines"):
              row = total.get(key, {})
              print(f"| {key} | {row.get('covered', 0)} | {row.get('total', 0)} | {row.get('pct', 0)}% |")
          PY
            else
              echo "coverage-summary.json was not produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint commit messages
        run: |
          npx --no -- commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

  deploy:
    name: Deploy to Vercel
    needs: [validate, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}

    steps:
      - name: Trigger Vercel production deploy
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST "${{ env.VERCEL_DEPLOY_HOOK }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "$body"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Vercel deploy hook failed with HTTP $http_code"
            exit 1
          fi

          echo "Vercel production deployment triggered successfully."

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Frontend deployment"
            echo "- **Status**: ${{ job.status }}"
            echo "- **Commit**: \`${{ github.sha }}\`"
            echo "- **Branch**: \`${{ github.ref_name }}\`"
            echo "- **Target**: https://evermount.co"
          } >> "$GITHUB_STEP_SUMMARY"
