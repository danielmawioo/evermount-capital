name: Deploy Frontend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  validate:
    name: Build & lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_GITHUB_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GITHUB_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Typecheck
        run: yarn typecheck

      - name: Dependency audit (production — blocking)
        run: yarn audit --groups dependencies --level high

      - name: Dependency audit (dev tooling)
        run: |
          set +e
          out=$(yarn audit --groups devDependencies --level high 2>&1)
          code=$?
          echo "$out"
          {
            echo "## Dev dependency audit"
            echo
            if [ "$code" -eq 0 ]; then
              echo "No high/critical findings in devDependencies."
            else
              echo "⚠️ Dev audit reported findings (non-blocking)."
              echo
              echo '```'
              echo "$out"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Build
        run: yarn build

  infra-validate:
    name: Infra validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Helm lint and template
        run: |
          helm lint helm/evermount-capital
          helm lint helm/evermount-capital -f helm/evermount-capital/values-ci.yaml
          helm template evermount helm/evermount-capital \
            --set image.tag=test \
            -f helm/evermount-capital/values-ci.yaml \
            > /tmp/evermount-manifests.yaml
          test -s /tmp/evermount-manifests.yaml

      - name: kubeconform
        run: |
          curl -sSL -o /tmp/kubeconform.tgz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/kubeconform.tgz -C "$HOME/.local/bin" kubeconform
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/kubeconform" -strict -ignore-missing-schemas \
            -kubernetes-version 1.28.0 \
            /tmp/evermount-manifests.yaml

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: error

      - name: Checkov Dockerfile
        uses: bridgecrewio/checkov-action@v12
        with:
          file: Dockerfile
          framework: dockerfile
          quiet: true
          soft_fail: false
          config_file: .checkov.yaml

      - name: Checkov Helm
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: helm/evermount-capital
          framework: helm
          quiet: true
          soft_fail: false
          config_file: .checkov.yaml
          var_file: values-ci.yaml

      - name: Docker Compose config
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.k8s.yml config >/dev/null

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests with coverage
        run: yarn test --coverage --coverageReporters=text-summary --coverageReporters=json-summary

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "## Test coverage"
            echo
            if [ -f coverage/coverage-summary.json ]; then
              python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("coverage/coverage-summary.json").read_text())
          total = data.get("total", {})
          print("| Metric | Covered | Total | Pct |")
          print("| --- | ---: | ---: | ---: |")
          for key in ("statements", "branches", "functions", "lines"):
              row = total.get(key, {})
              print(f"| {key} | {row.get('covered', 0)} | {row.get('total', 0)} | {row.get('pct', 0)}% |")
          PY
            else
              echo "coverage-summary.json was not produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint commit messages
        run: |
          npx --no -- commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

  deploy:
    name: Deploy to Vercel
    needs: [validate, test, infra-validate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}

    steps:
      - name: Trigger Vercel production deploy
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST "${{ env.VERCEL_DEPLOY_HOOK }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "$body"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Vercel deploy hook failed with HTTP $http_code"
            exit 1
          fi

          echo "Vercel production deployment triggered successfully."

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Frontend deployment"
            echo "- **Status**: ${{ job.status }}"
            echo "- **Commit**: \`${{ github.sha }}\`"
            echo "- **Branch**: \`${{ github.ref_name }}\`"
            echo "- **Target**: https://evermount.co"
          } >> "$GITHUB_STEP_SUMMARY"
