name: Deploy Frontend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  VERCEL_ORG_ID: team_g1ftCcKDPvxTGOPWgfUqSoMe
  VERCEL_PROJECT_ID: prj_tRPb5l7auEFV9iPLVRoFwzxwa1Rf
  VERCEL_DEPLOY_HOOK: https://api.vercel.com/v1/integrations/deploy/prj_tRPb5l7auEFV9iPLVRoFwzxwa1Rf/W6cP0DZaIm

jobs:
  validate:
    name: Build & lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_GITHUB_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GITHUB_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn next lint --max-warnings=0

      - name: Typecheck
        run: yarn typecheck

      - name: Dependency audit (production — blocking)
        run: yarn audit --groups dependencies --level high

      - name: Dependency audit (dev tooling — informational)
        run: yarn audit --groups devDependencies --level high
        continue-on-error: true

      - name: Build
        run: yarn build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

  deploy:
    name: Deploy to Vercel
    needs: [validate, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Trigger Vercel production deploy
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST "${{ env.VERCEL_DEPLOY_HOOK }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "$body"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Vercel deploy hook failed with HTTP $http_code"
            exit 1
          fi

          echo "Vercel production deployment triggered successfully."

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Frontend deployment"
            echo "- **Status**: ${{ job.status }}"
            echo "- **Commit**: \`${{ github.sha }}\`"
            echo "- **Branch**: \`${{ github.ref_name }}\`"
            echo "- **Target**: https://evermount.co"
          } >> "$GITHUB_STEP_SUMMARY"
