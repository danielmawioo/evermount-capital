name: Dependency freshness

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  outdated:
    name: yarn outdated
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Report outdated packages
        run: |
          set +e
          out=$(yarn outdated 2>&1)
          echo "$out"
          {
            echo "## yarn outdated"
            echo
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
