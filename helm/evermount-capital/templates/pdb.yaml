{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "evermount-capital.fullname" . }}
  labels:
    {{- include "evermount-capital.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "evermount-capital.selectorLabels" . | nindent 6 }}
{{- end }}
