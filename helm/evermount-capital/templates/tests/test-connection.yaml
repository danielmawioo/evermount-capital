apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "evermount-capital.fullname" . }}-test-connection"
  labels:
    {{- include "evermount-capital.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - wget
      args:
        - "--spider"
        - "-q"
        - "http://{{ include "evermount-capital.fullname" . }}:{{ .Values.service.port }}/api/health"
